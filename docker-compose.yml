services:
  env:
    container_name: Shiny_Glances_Env
    image: rocker/verse:4.1
    restart: unless-stopped
    ports:
      - "4040:8787"
    volumes:
      - /sbidata:/sbidata
      - /opt/ngs2/:/opt/ngs2
      - ./src/Rprofile.R:/usr/local/lib/R/etc/Rprofile.site
      - .:/analysis
      - ./src/welcome.html:/srv/shiny-server/index.html
    environment:
      - USERID=${USER_ID:-1000}
      - GROUPID=${GROUP_ID:-1000}
      - DISABLE_AUTH=true
    hostname: ${HOSTNAME}
    command: /init

  shiny:
    container_name: Shiny_Glances
    image: localhost/shiny-verse:4.1_SBI
    restart: unless-stopped
    ports:
      - "4444:3838"
    volumes:
      - /sbidata:/sbidata
      - /opt/ngs2/:/opt/ngs2
      - ./src/Rprofile.R:/usr/local/lib/R/etc/Rprofile.site
      - .:/analysis
      - ./src/welcome.html:/srv/shiny-server/index.html
      - .:/srv/shiny-server/glances
    hostname: ${HOSTNAME}
